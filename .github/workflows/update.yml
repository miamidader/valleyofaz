name: Update news feed
# Refreshes data/items.json a few times a day.
on:
  schedule:
    - cron: '0 12 * * *'   # 5 AM Arizona
    - cron: '0 18 * * *'   # 11 AM
    - cron: '0 23 * * *'   # 4 PM
    - cron: '0 4 * * *'    # 9 PM
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_feeds.py
      - name: Save feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/items.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update feed"
          git pull --rebase origin main
          git push
