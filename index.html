<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valley Feed">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap">
<title>Valley of AZ Feed</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f2f2f2;--muted:#9b9b9b;--line:#2a2a2a;--accent:#C4F765;--accent-ink:#0a0a0a;--hot:#C4F765;--rise:#f2b233;--calm:#6d6d6d;color-scheme:dark;--display:Anton,"Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto}
.title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 0 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;border-radius:50%;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;color:var(--accent);margin-top:3px;font-weight:600}
.stamp{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-top:2px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip b{font-weight:600;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.chip.sm{font-size:13px;padding:4px 10px;background:transparent}
.chip.sm[aria-pressed="true"]{background:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#ptr{height:0;overflow:hidden;text-align:center;font-size:13px;color:var(--muted);transition:height .15s}
#ptr span{display:block;padding-top:10px}
.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
h2{font-family:var(--display);font-weight:400;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* top story cards */
.cards{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:14px;cursor:pointer;align-items:flex-start}
.ring{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c) calc(var(--s)*1%),var(--line) 0)}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.body{min-width:0;flex:1}
.kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:3px}
.card .ttl{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.12;letter-spacing:.015em;text-transform:uppercase;display:block;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .city{color:var(--accent);font-weight:600}
/* compact rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:11px 12px;cursor:pointer}
.pill{flex:none;min-width:34px;text-align:center;font-family:var(--display);font-weight:400;font-size:15px;padding:3px 0;border-radius:8px;color:var(--c);border:1.5px solid var(--c);font-variant-numeric:tabular-nums}
.row .ttl{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}
.row .meta{margin-top:3px}
/* expanded detail */
.detail{padding:0 14px 14px;border-top:1px dashed var(--line)}
.card .detail{padding-top:12px}
.row-wrap .detail{padding:10px 12px 12px 56px}
.detail p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.why span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.also{font-size:13px;color:var(--muted);margin:0 0 10px}
.also a{color:var(--accent);text-decoration:none;margin-right:8px;white-space:nowrap}
.acts{display:flex;gap:16px;flex-wrap:wrap}
.act{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.more{display:block;width:100%;margin-top:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--accent);font:inherit;font-size:14px;cursor:pointer}
.day{font-size:12px;color:var(--muted);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
details.info{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px}
details.info summary{cursor:pointer;font-weight:600}
details.info p{color:var(--muted);margin:8px 0 0}
.s{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.bad{color:var(--hot)}
</style>
</head>
<body>
<div class="wrap">
 <div class="title"><div class="brand"><img src="assets/logo.png" alt="Valley of AZ"><h1>Valley of AZ<span class="sub">NEWS FEED</span></h1></div><span class="stamp" id="stamp">loading…</span></div>
 <div class="bar">
  <div class="chips" id="cats" role="group" aria-label="Topic"></div>
  <div class="chips" id="cities" role="group" aria-label="City"></div>
 </div>
 <div id="ptr"><span id="ptrtxt">Pull to refresh</span></div>
 <main id="out"><div class="empty">Loading…</div></main>
</div>
<script>
(function(){
var DATA=null,cat="All",city="All",sort="hot",open=null,restOpen=false,restLimit=40,newLimit=30;
var CATS=["All","Crime & Safety","Roads & Weather","Government","Sports","Community"];
var TOP=5,RISING=15;
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function safe(u){return /^https?:\/\//i.test(u)?u:"#"}
function when(i){return new Date(i.latest||i.published).getTime()}
function hrs(i){return Math.max(0,(Date.now()-when(i))/3600000)}
function ago(iso){var s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" hr ago";return Math.round(s/86400)+" d ago"}
function score(i){return Math.min(100,Math.round((i.base||0)+24*Math.exp(-hrs(i)/10)))}
function tier(s){return s>=70?["HOT","var(--hot)"]:s>=50?["RISING","var(--rise)"]:["","var(--calm)"]}
function label(i){return i.cities&&i.cities.length?i.cities[0]:"Valley"}
function chip(l,n,on,fn,sm){var b=el("button","chip"+(sm?" sm":""),l);b.type="button";if(n!=null)b.appendChild(el("b","",n));b.setAttribute("aria-pressed",on);b.onclick=fn;return b}
function copy(s,btn){var o=btn.textContent;function ok(){btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1200)}
 function fb(){var t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(ok,fb)}else fb()}
function inCity(i){return city==="All"||(i.cities||[]).indexOf(city)>-1}
function inCat(i){return cat==="All"||i.cat===cat}
function metaLine(i){
 var m=el("div","meta");m.appendChild(el("span","city",label(i)));
 var n=(i.outlets||1);m.appendChild(el("span","",i.source+(n>1?" +"+(n-1)+" more":"")));
 m.appendChild(el("span","",ago(i.latest||i.published)));m.appendChild(el("span","",i.cat));return m}
function detail(i,s){
 var d=el("div","detail");
 if(i.summary)d.appendChild(el("p","",i.summary));
 var w=el("div","why"),why=(i.why||[]).slice();if(hrs(i)<6)why.push("Fresh");
 why.forEach(function(x){w.appendChild(el("span","",x))});if(why.length){d.appendChild(w)}
 var seen={};seen[(i.source||"").toLowerCase()]=1;var mem=(i.members||[]).filter(function(m){var k=m.source.toLowerCase();if(seen[k])return false;seen[k]=1;return true}).slice(0,6);
 if(mem.length){var a=el("p","also","Also reported by ");mem.forEach(function(m){var l=el("a","",m.source);l.href=safe(m.link);l.target="_blank";l.rel="noopener";a.appendChild(l)});d.appendChild(a)}
 var ac=el("div","acts"),o=el("a","act","Open story ↗");o.href=safe(i.link);o.target="_blank";o.rel="noopener";ac.appendChild(o);
 [["Copy headline",i.title],["Copy link",i.link]].forEach(function(x){var b=el("button","act",x[0]);b.type="button";b.onclick=function(){copy(x[1],b)};ac.appendChild(b)});
 d.appendChild(ac);return d}
function ringEl(s,col){var r=el("div","ring");r.style.setProperty("--s",s);r.style.setProperty("--c",col);r.appendChild(el("span","",String(s)));return r}
function cardEl(i){
 var s=score(i),t=tier(s),c=el("article","card"),b=el("button","");b.type="button";b.setAttribute("aria-expanded",open===i.id);
 b.style.setProperty("--c",t[1]);b.appendChild(ringEl(s,t[1]));
 var body=el("div","body");if(t[0])body.appendChild(el("div","kick",t[0]));
 body.appendChild(el("span","ttl",i.title));body.appendChild(metaLine(i));b.appendChild(body);
 b.onclick=function(){open=open===i.id?null:i.id;render()};c.appendChild(b);
 if(open===i.id)c.appendChild(detail(i,s));return c}
function rowEl(i){
 var s=score(i),t=tier(s),w=el("div","item row-wrap"),r=el("button","row");r.type="button";r.setAttribute("aria-expanded",open===i.id);
 r.style.setProperty("--c",t[1]);r.appendChild(el("span","pill",String(s)));
 var m=el("span","");m.style.cssText="min-width:0;flex:1";m.appendChild(el("span","ttl",i.title));m.appendChild(metaLine(i));r.appendChild(m);
 r.onclick=function(){open=open===i.id?null:i.id;render()};w.appendChild(r);
 if(open===i.id)w.appendChild(detail(i,s));return w}
function listEl(items){var l=el("div","list");items.forEach(function(i){l.appendChild(rowEl(i))});return l}
function head(title,withSeg){var h=el("div","head");h.appendChild(el("h2","",title));
 if(withSeg){var sg=el("div","seg");[["hot","Hot"],["new","Newest"]].forEach(function(x){var b=el("button","",x[1]);b.type="button";b.setAttribute("aria-pressed",sort===x[0]);b.onclick=function(){sort=x[0];open=null;render()};sg.appendChild(b)});h.appendChild(sg)}
 return h}
function render(){
 var items=DATA.items.map(function(i){i._s=score(i);return i});
 var cats=$("cats");cats.textContent="";
 CATS.forEach(function(c){var n=items.filter(function(i){return (c==="All"||i.cat===c)&&inCity(i)}).length;
  cats.appendChild(chip(c,n,c===cat,function(){cat=c;open=null;restOpen=false;restLimit=40;newLimit=30;render()}))});
 var counts={};items.forEach(function(i){if(inCat(i))(i.cities||[]).forEach(function(c){counts[c]=(counts[c]||0)+1})});
 var cs=$("cities");cs.textContent="";
 cs.appendChild(chip("All cities",null,city==="All",function(){city="All";open=null;restOpen=false;restLimit=40;newLimit=30;render()},true));
 Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).forEach(function(c){
  cs.appendChild(chip(c,counts[c],city===c,function(){city=c;open=null;restOpen=false;restLimit=40;newLimit=30;render()},true))});
 var out=$("out");out.textContent="";
 var f=items.filter(function(i){return inCat(i)&&inCity(i)});
 if(!f.length){out.appendChild(el("div","empty","Nothing here yet. Try All cities."))}
 else if(sort==="hot"){
  f.sort(function(a,b){return b._s-a._s||when(b)-when(a)});
  var top=f.slice(0,TOP),rising=f.slice(TOP,TOP+RISING),rest=f.slice(TOP+RISING);
  out.appendChild(head("Top stories right now",true));
  var g=el("div","cards");top.forEach(function(i){g.appendChild(cardEl(i))});out.appendChild(g);
  if(rising.length){out.appendChild(head("Also moving",false));out.appendChild(listEl(rising))}
  if(rest.length){
   if(!restOpen){var b=el("button","more","Show "+rest.length+" more stories");b.type="button";b.onclick=function(){restOpen=true;render()};out.appendChild(b)}
   else{out.appendChild(head("Everything else",false));out.appendChild(listEl(rest.slice(0,restLimit)));
    if(rest.length>restLimit){var m=el("button","more","Show "+(rest.length-restLimit)+" more");m.type="button";m.onclick=function(){restLimit+=60;render()};out.appendChild(m)}}}
 } else {
  f.sort(function(a,b){return when(b)-when(a)});
  out.appendChild(head("Newest first",true));
  out.appendChild(listEl(f.slice(0,newLimit)));
  if(f.length>newLimit){var nb=el("button","more","Show "+Math.min(60,f.length-newLimit)+" more");nb.type="button";nb.onclick=function(){newLimit+=60;render()};out.appendChild(nb)}
 }
 var det=el("details","info"),ok=DATA.feeds.filter(function(x){return x.ok}).length;
 det.appendChild(el("summary","","How scores work and source status"));
 det.appendChild(el("p","","The 0 to 100 score adds up how many outlets cover the same story, how urgent or high-stakes the wording is, whether it has a strong hook, whether a local outlet reported it, whether a city is named, and how fresh it is. Tap a story to see exactly why it scored what it did."));
 det.appendChild(el("p","","Sources: "+ok+" of "+DATA.feeds.length+" working."));
 DATA.feeds.forEach(function(x){var r=el("div","s");r.appendChild(el("span","",x.name));r.appendChild(el("span",x.ok?"":"bad",x.ok?x.count+" items":"failed"));det.appendChild(r)});
 out.appendChild(det);
 $("stamp").textContent="updated "+ago(DATA.generated)}
function load(manual){
 var t=$("ptrtxt");if(manual)t.textContent="Refreshing…";
 return fetch("data/items.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  DATA=d;render();if(manual)t.textContent="Up to date"}).catch(function(){
  if(!DATA){$("out").textContent="";$("out").appendChild(el("div","empty","No news yet. The first update runs automatically and can take a few minutes after setup."));$("stamp").textContent=""}
  if(manual)t.textContent="Couldn't refresh"})}
var y0=null,pull=0,ptr=$("ptr");
window.addEventListener("touchstart",function(e){y0=window.scrollY<=0?e.touches[0].clientY:null;pull=0},{passive:true});
window.addEventListener("touchmove",function(e){if(y0==null)return;pull=e.touches[0].clientY-y0;
 if(pull>0&&window.scrollY<=0){ptr.style.height=Math.min(pull/2,50)+"px";$("ptrtxt").textContent=pull>110?"Release to refresh":"Pull to refresh"}},{passive:true});
window.addEventListener("touchend",function(){if(y0==null)return;
 if(pull>110){ptr.style.height="40px";load(true).then(function(){setTimeout(function(){ptr.style.height="0"},800)})}else ptr.style.height="0";y0=null;pull=0});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")load()});
load();
})();
</script>
</body>
</html>
